# =============================================================================
# ElasticMQ — emulador SQS local
# Formato HOCON; se carga al arrancar el contenedor desde /opt/elasticmq.conf
#
# Estructura: replica exactamente lo que define serverless.yml para AWS:
#   - prueba-altera-b2-webhook-queue-dev : visibility 5 min, redrive 3 → DLQ
#   - prueba-altera-b2-webhook-dlq-dev   : retención larga, sin redrive
# =============================================================================

include classpath("application.conf")

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

# Colas pre-creadas al arrancar. Si necesitas otro stage, agrega su par aquí
# o usa el script bootstrap-local.sh para crearlas vía aws-cli.
queues {

    prueba-altera-b2-webhook-dlq-dev {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        fifo = false
        contentBasedDeduplication = false
    }

    prueba-altera-b2-webhook-queue-dev {
        defaultVisibilityTimeout = 300 seconds   # 5 min, match con serverless.yml
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        fifo = false
        contentBasedDeduplication = false
        deadLettersQueue {
            name = "prueba-altera-b2-webhook-dlq-dev"
            maxReceiveCount = 3
        }
    }
}
